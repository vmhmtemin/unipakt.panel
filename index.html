<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="robots" content="noindex, nofollow">

    <title>UniPakt Panel</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
        }

        .dot {
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            margin: 0 auto 30px;
        }

        h1 {
            font-size: 48px;
            font-weight: 500;
            letter-spacing: -2px;
            margin: 0 0 15px;
        }

        p {
            color: #999;
            font-size: 16px;
            margin: 0;
        }

        .status {
            margin-top: 35px;
            padding: 12px 20px;
            border: 1px solid #333;
            display: inline-block;
            font-size: 13px;
            color: #ccc;
        }
    </style>
</head>

<body>

    <main class="container">
        <div class="dot"></div>

        <h1>UniPakt.</h1>

        <p>Kulüp Başkanları Paneli</p>

        <div class="status">
            Panel bağlantısı çalışıyor.
        </div>
    </main>

</body>
</html>
